# ── FULL local stack — everything in ONE compose ─────────────────────────────
# Brings up the whole Resona platform on a single host:
#
#   pwa                  Nuxt 4 SPA + Nitro server   → host :7701
#   directus             auth / data / file storage  → host :7700
#   directus-bootstrap   one-shot schema/role/token provisioner (idempotent)
#   directus-transcribe  batch worker (Directus → resona-api → transcripts)
#   resona-api           transcription API           → host :7710
#   engine-faster-whisper  CPU ASR engine for resona-api
#
# Like ../resona-stack, but self-contained: it also builds + runs the PWA and the
# Directus data layer here, instead of expecting the two stacks to be split.
# This is a deliberate convenience for local/dev use — it reaches into the
# sibling resona monorepo checkout (default ../resona, override with RESONA_REPO)
# to BUILD the api + engine images. Production still keeps the stacks split
# (README → the two-stack model); don't wire this into the default `up`.
#
# Usage (recommended — `bun run setup` generates+persists the worker token to
# .env, then brings the stack up):
#   bun run setup
#   bun run setup --down                       # stop (add --volumes to wipe data)
#
# Manual equivalent:
#   cp .env.stack.example .env   # then set DIRECTUS_TOKEN (openssl rand -hex 24)
#   docker compose -f docker-compose.full.yml up -d --build
#   docker compose -f docker-compose.full.yml down            # --volumes to wipe data
#
# Engine: the native MLX engine (Apple GPU, `bun run engine` on :7720) is
# PREFERRED. resona-api always probes it first and `bun run setup` starts the CPU
# docker engine (profile cpu-engine) ONLY when no native engine is live — so a
# running MLX is used instead of the CPU container. To use MLX: `bun run engine`
# in one terminal, then `bun run setup` in another.
#
# First start builds the api image (+ the CPU engine image and its multi-GB model
# download when the cpu-engine profile is active) — the engine healthcheck allows
# a 300s start period.
services:
  # ── Frontend ────────────────────────────────────────────────────────────
  pwa:
    build:
      context: .
      dockerfile: Dockerfile
      # Baked into the client bundle (ssr:false) → must be BROWSER-reachable
      # host URLs, i.e. the published ports below, not compose service names.
      args:
        NUXT_PUBLIC_DIRECTUS_URL: ${NUXT_PUBLIC_DIRECTUS_URL:-http://localhost:7700}
        NUXT_PUBLIC_RESONA_API_URL: ${NUXT_PUBLIC_RESONA_API_URL:-http://localhost:7710}
        NUXT_PUBLIC_RESONA_API_KEY: ${RESONA_API_KEY:-}
        NUXT_PUBLIC_DEFAULT_LANGUAGE: ${NUXT_PUBLIC_DEFAULT_LANGUAGE:-de}
        NUXT_PUBLIC_DEFAULT_PROFILE: ${NUXT_PUBLIC_DEFAULT_PROFILE:-default}
        NUXT_PUBLIC_DEFAULT_ENGINE: ${TRANSCRIBE_ENGINE:-faster-whisper}
        NUXT_PUBLIC_CALENDAR_ENABLED: ${NUXT_PUBLIC_CALENDAR_ENABLED:-true}
    ports:
      - "${PWA_PORT:-7701}:3000"
    environment:
      # Server-only OAuth secrets for the Nitro calendar layer (never bundled).
      NUXT_GOOGLE_CLIENT_ID: ${NUXT_GOOGLE_CLIENT_ID:-}
      NUXT_GOOGLE_CLIENT_SECRET: ${NUXT_GOOGLE_CLIENT_SECRET:-}
      NUXT_GOOGLE_REDIRECT_URI: ${NUXT_GOOGLE_REDIRECT_URI:-}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-}
    depends_on:
      directus:
        condition: service_healthy
    restart: unless-stopped

  # ── Data layer ────────────────────────────────────────────────────────────
  directus:
    image: directus/directus:11
    ports:
      - "7700:8055"
    volumes:
      - directus-db:/directus/database
      - directus-uploads:/directus/uploads
      - ./directus/schema-snapshot.yaml:/directus/schema-snapshot.yaml
    environment:
      SECRET: ${DIRECTUS_SECRET:-change-me-in-env}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-change-me}
      DB_CLIENT: sqlite3
      DB_FILENAME: /directus/database/data.db
      WEBSOCKETS_ENABLED: "true"
      CORS_ENABLED: "true"
      # The running PWA's browser origin (its published port below).
      CORS_ORIGIN: ${PWA_ORIGIN:-http://localhost:7701}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8055/server/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  directus-bootstrap:
    image: node:24-alpine
    volumes:
      - ./directus/bootstrap.mjs:/bootstrap.mjs:ro
    environment:
      DIRECTUS_URL: http://directus:8055
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-change-me}
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:?set DIRECTUS_TOKEN in .env (e.g. openssl rand -hex 24)}
    command: ["node", "/bootstrap.mjs"]
    depends_on:
      directus:
        condition: service_healthy
    restart: "no"

  directus-transcribe:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN}
      # resona-api lives in THIS stack — reach it over the compose network.
      RESONA_API_URL: http://resona-api:7000
      RESONA_API_KEY: ${RESONA_API_KEY:-}
      # Empty by default → the worker does NOT pin an engine, so resona-api
      # auto-selects the first AVAILABLE engine in its RESONA_ENGINE_URLS order
      # (native MLX first, dockerized CPU faster-whisper as fallback). Pin a name
      # here only to force a specific engine.
      TRANSCRIBE_ENGINE: ${TRANSCRIBE_ENGINE:-}
      TRANSCRIBE_POLL_INTERVAL: ${TRANSCRIBE_POLL_INTERVAL:-5}
      TRANSCRIBE_CONCURRENCY: ${TRANSCRIBE_CONCURRENCY:-2}
      TRANSCRIBE_STALE_MINUTES: ${TRANSCRIBE_STALE_MINUTES:-15}
      LOGLEVEL: ${LOGLEVEL:-info}
    depends_on:
      directus:
        condition: service_healthy
      directus-bootstrap:
        condition: service_completed_successfully
      resona-api:
        condition: service_healthy
    restart: unless-stopped

  # ── Transcription backend (built from the sibling resona monorepo) ──────────
  resona-api:
    build:
      context: ${RESONA_REPO:-../resona}
      dockerfile: packages/api/Dockerfile
    ports:
      - "7710:7000"
    volumes:
      - resona-audio:/app/data/files
      - resona-md:/app/data/md
      - resona-db:/app/data/db
      - resona-profiles:/app/data/profiles
    environment:
      # Engine pool, in PREFERENCE order: the native MLX engine on the host
      # (Apple GPU, ./run-engine.sh on :7720) FIRST, the dockerized CPU
      # faster-whisper engine as fallback. resona-api probes /health on each and
      # picks the first available — so a running native MLX is used automatically
      # in place of the CPU container, with no reconfiguration.
      RESONA_ENGINE_URLS: ${RESONA_ENGINE_URLS:-http://host.docker.internal:7720,http://engine-faster-whisper:7001}
      DATA_PATH: /app/data
      # Leave RESONA_API_KEY unset to disable auth; if set, the worker + live
      # path must send the same key.
      RESONA_API_KEY: ${RESONA_API_KEY:-}
      LOGLEVEL: ${LOGLEVEL:-info}
    extra_hosts:
      # lets the container reach the native MLX engine on the docker host
      - "host.docker.internal:host-gateway"
    depends_on:
      engine-faster-whisper:
        condition: service_healthy
        # The CPU engine is behind the `cpu-engine` profile (off by default).
        # required:false → resona-api still starts when only native MLX is used.
        required: false
    healthcheck:
      test: ["CMD", "python3.12", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # CPU ASR fallback — OFF by default (profile cpu-engine). Only needed when no
  # native MLX engine is running on the host. `bun run setup` auto-detects a live
  # native engine on :7720 and starts this profile only when it's absent.
  # Not host-published (no `ports`): resona-api reaches it over the compose
  # network at engine-faster-whisper:7001, leaving host :7720 free for native MLX.
  engine-faster-whisper:
    profiles: ["cpu-engine"]
    build:
      context: ${RESONA_REPO:-../resona}
      dockerfile: packages/engine-faster-whisper/Dockerfile
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    environment:
      RESONA_ENGINE: faster-whisper
      DEFAULT_FASTWHISPER_MODEL: ${FASTWHISPER_MODEL:-large-v3}
      LOGLEVEL: ${LOGLEVEL:-info}
    healthcheck:
      test: ["CMD", "python3.12", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

volumes:
  directus-db:
  directus-uploads:
  resona-audio:
  resona-md:
  resona-db:
  resona-profiles:
