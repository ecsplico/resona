[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resona-project-worker"
version = "0.1.0"
description = "Project worker: sends CMS recordings and documents through the Resona hub and writes results back"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "mortegro", email = "495066+mortegro@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-decouple>=3.8",
]

[project.scripts]
resona-project-worker = "resona_project_worker.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/resona_project_worker"]

[dependency-groups]
dev = [
    "anyio>=4.14.0",
    "pytest>=9.1.1",
    "pytest-anyio>=0.0.0",
    "respx>=0.23.1",
]
