# ── TESTING ONLY ────────────────────────────────────────────────────────────
# Brings the resona transcription stack (resona-api + the faster-whisper engine)
# up *inside this project's compose* so the directus-transcribe worker can
# complete batch jobs end-to-end — without starting the separate resona stack by
# hand.
#
# This is a deliberate, opt-in exception to the standalone rule (README → the
# two-stack split): it reaches into the sibling resona monorepo checkout to BUILD
# its images. Set RESONA_REPO if that checkout isn't at ../resona. Never wire this
# into the default `docker compose up`; production keeps the two stacks split.
#
# Usage (merge with the base file):
#   docker compose -f docker-compose.yml -f docker-compose.resona-test.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.resona-test.yml down
#
# First start builds two images and the engine downloads its model (multi-GB,
# minutes) — the engine healthcheck allows a 300s start period. Auth is disabled
# (RESONA_API_KEY unset here, empty in the worker), so the two agree with no key.
services:
  engine-faster-whisper:
    build:
      context: ${RESONA_REPO:-../resona}
      dockerfile: packages/engine-faster-whisper/Dockerfile
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    environment:
      RESONA_ENGINE: faster-whisper
      DEFAULT_FASTWHISPER_MODEL: ${FASTWHISPER_MODEL:-large-v3}
      LOGLEVEL: ${LOGLEVEL:-info}
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3.12", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  resona-api:
    build:
      context: ${RESONA_REPO:-../resona}
      dockerfile: packages/api/Dockerfile
    ports:
      # published so a browser / the live path can reach it too (matches :7710)
      - "7710:7000"
    volumes:
      - resona-audio:/app/data/files
      - resona-md:/app/data/md
      - resona-db:/app/data/db
      - resona-profiles:/app/data/profiles
    environment:
      RESONA_ENGINE_URLS: http://engine-faster-whisper:7001
      DATA_PATH: /app/data
      # RESONA_API_KEY intentionally unset → resona-api disables auth.
      LOGLEVEL: ${LOGLEVEL:-info}
    depends_on:
      engine-faster-whisper:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python3.12", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Override fragment (merged onto the base service): point the worker at the
  # in-stack API over the compose network and make it wait for the API to be
  # healthy. The base file's depends_on (directus, directus-bootstrap) is kept.
  directus-transcribe:
    environment:
      RESONA_API_URL: http://resona-api:7000
    depends_on:
      resona-api:
        condition: service_healthy

volumes:
  resona-audio:
  resona-md:
  resona-db:
  resona-profiles:
