# PWA data layer: Directus (auth/data/files) + the directus-transcribe worker.
# Resona (api + engines) runs as a SEPARATE stack from the resona monorepo and is
# reached over the network via RESONA_API_URL below.
services:
  directus:
    image: directus/directus:11
    ports:
      - "7700:8055"
    volumes:
      - directus-db:/directus/database
      - directus-uploads:/directus/uploads
      # writable: `directus schema snapshot` (directus/bootstrap.md §4) exports here
      - ./directus/schema-snapshot.yaml:/directus/schema-snapshot.yaml
    environment:
      SECRET: ${DIRECTUS_SECRET:-change-me-in-env}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-change-me}
      DB_CLIENT: sqlite3
      DB_FILENAME: /directus/database/data.db
      WEBSOCKETS_ENABLED: "true"
      # CORS so the browser PWA origin may call Directus directly.
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${PWA_ORIGIN:-http://localhost:3000}
    healthcheck:
      # 127.0.0.1, not localhost: inside the container `localhost` resolves to ::1
      # (IPv6) first, but Directus binds IPv4 0.0.0.0 — wget to ::1 is refused and
      # the container would never report healthy, blocking the worker's depends_on.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8055/server/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # One-shot: brings a blank Directus up to the schema/roles/worker-token state
  # in directus/bootstrap.md. Idempotent — re-runs harmlessly on every `up`.
  directus-bootstrap:
    image: node:24-alpine
    volumes:
      - ./directus/bootstrap.mjs:/bootstrap.mjs:ro
    environment:
      DIRECTUS_URL: http://directus:8055
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-change-me}
      # Pinned as the worker's static token, so DIRECTUS_TOKEN below just works.
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:?set DIRECTUS_TOKEN in .env (e.g. openssl rand -hex 24)}
    command: ["node", "/bootstrap.mjs"]
    depends_on:
      directus:
        condition: service_healthy
    restart: "no"

  directus-transcribe:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN}
      # resona-api lives in the separate resona stack — point this at its reachable URL.
      RESONA_API_URL: ${RESONA_API_URL:-http://host.docker.internal:7710}
      RESONA_API_KEY: ${RESONA_API_KEY:-}
      # Engine requested for every batch job and stamped on the transcript row.
      TRANSCRIBE_ENGINE: ${TRANSCRIBE_ENGINE:-faster-whisper}
      TRANSCRIBE_POLL_INTERVAL: ${TRANSCRIBE_POLL_INTERVAL:-5}
      TRANSCRIBE_CONCURRENCY: ${TRANSCRIBE_CONCURRENCY:-2}
      TRANSCRIBE_STALE_MINUTES: ${TRANSCRIBE_STALE_MINUTES:-15}
      LOGLEVEL: ${LOGLEVEL:-info}
    extra_hosts:
      # lets the container reach a resona-api running on the docker host (Linux)
      - "host.docker.internal:host-gateway"
    depends_on:
      directus:
        condition: service_healthy
      directus-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  directus-db:
  directus-uploads:
