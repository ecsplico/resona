# Coolify variant of docker-compose.yml, "Raw Compose Deployment" ON: no published
# ports; the Caddy labels below route the PWA host (like the hub's compose file).
# Directus is internal only: the PWA proxies it at /directus. Keycloak (realm
# ecsplico) is the SSO provider. Missing secrets fail the deploy. Build pack "Docker
# Compose", base directory /apps/resona-pwa, compose file /docker-compose.coolify.yml.
# Runbook: docs/server/coolify.md.
# PWA data layer: Directus (auth/data/files) + the project-worker (recordings and
# documents → durable hub jobs → results back into Directus).
# Resona (api + engines) runs as a SEPARATE stack from the resona monorepo and is
# reached over the network via RESONA_API_URL below.
services:
  directus:
    image: directus/directus:11
    expose:
      - "8055"
    volumes:
      - directus-db:/directus/database
      - directus-uploads:/directus/uploads
    environment:
      SECRET: ${DIRECTUS_SECRET:?set DIRECTUS_SECRET}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?set DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?set DIRECTUS_ADMIN_PASSWORD}
      DB_CLIENT: sqlite3
      DB_FILENAME: /directus/database/data.db
      WEBSOCKETS_ENABLED: "true"
      # CORS so the browser PWA origin may call Directus directly.
      CORS_ENABLED: "true"
      # Directus has no host of its own: the PWA proxies it at ${PWA_ORIGIN}/directus
      # (server/routes/directus/[...path].ts), which is also where Keycloak returns.
      PUBLIC_URL: ${PWA_ORIGIN}/directus
      REFRESH_TOKEN_COOKIE_SECURE: "true"
      REFRESH_TOKEN_COOKIE_SAME_SITE: lax
      # Session length. The refresh-token cookie's maxAge is REFRESH_TOKEN_TTL
      # (Directus has no separate cookie TTL for it); every /auth/refresh starts a
      # new REFRESH_TOKEN_TTL window, so this is an idle limit. SESSION_COOKIE_TTL
      # only applies to "session" mode logins and is kept in step.
      ACCESS_TOKEN_TTL: ${DIRECTUS_ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${DIRECTUS_REFRESH_TOKEN_TTL:-30d}
      SESSION_COOKIE_TTL: ${DIRECTUS_SESSION_COOKIE_TTL:-30d}
      AUTH_PROVIDERS: keycloak
      AUTH_KEYCLOAK_DRIVER: openid
      # refresh-token cookie (the PWA exchanges it via /auth/refresh, mode json);
      # the default "session" mode would set a session cookie the PWA's bearer-token
      # client cannot exchange.
      AUTH_KEYCLOAK_MODE: cookie
      AUTH_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-resona-pwa}
      AUTH_KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set KEYCLOAK_CLIENT_SECRET}
      AUTH_KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-https://keycloak.ecsplico.de/realms/ecsplico/.well-known/openid-configuration}
      # Directus refreshes the stored Keycloak refresh token on EVERY /auth/refresh
      # (openid driver refresh()); invalid_grant there = 401 = logged out. Without
      # offline_access that token dies with Keycloak's SSO session (realm default
      # 30 min idle / 10 h max). offline_access yields an offline token bound to
      # "Offline Session Idle" (default 30 d) instead. Realm steps: docs/server/coolify.md.
      AUTH_KEYCLOAK_SCOPE: ${KEYCLOAK_SCOPE:-openid profile email offline_access}
      AUTH_KEYCLOAK_IDENTIFIER_KEY: email
      AUTH_KEYCLOAK_ALLOW_PUBLIC_REGISTRATION: "true"
      AUTH_KEYCLOAK_DEFAULT_ROLE_ID: ${DIRECTUS_USER_ROLE_ID:?set DIRECTUS_USER_ROLE_ID}
      AUTH_KEYCLOAK_REDIRECT_ALLOW_LIST: ${PWA_ORIGIN}/login
      CORS_ORIGIN: ${PWA_ORIGIN:?set PWA_ORIGIN}
    healthcheck:
      # 127.0.0.1, not localhost: inside the container `localhost` resolves to ::1
      # (IPv6) first, but Directus binds IPv4 0.0.0.0 — wget to ::1 is refused and
      # the container would never report healthy, blocking the worker's depends_on.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8055/server/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # One-shot: brings a blank Directus up to the schema/roles/worker-token state
  # in directus/bootstrap.md. Idempotent — re-runs harmlessly on every `up`.
  directus-bootstrap:
    # Built, not bind-mounted: Coolify runs the raw compose where the git checkout
    # is not on the host filesystem, so relative bind mounts would be empty.
    build:
      context: ./directus
      dockerfile: Dockerfile.bootstrap
    environment:
      DIRECTUS_URL: http://directus:8055
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?set DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?set DIRECTUS_ADMIN_PASSWORD}
      # Pinned as the worker's static token, so DIRECTUS_TOKEN below just works.
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:?set DIRECTUS_TOKEN in .env (e.g. openssl rand -hex 24)}
    depends_on:
      directus:
        condition: service_healthy
    restart: "no"

  pwa:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time — must be browser-reachable
        # host URLs (not compose service names). Override in .env for external access.
        NUXT_PUBLIC_DIRECTUS_URL: ${NUXT_PUBLIC_DIRECTUS_URL:-http://localhost:7700}
        NUXT_PUBLIC_RESONA_API_URL: ${NUXT_PUBLIC_RESONA_API_URL:-http://localhost:7710}
        NUXT_PUBLIC_DEFAULT_LANGUAGE: ${NUXT_PUBLIC_DEFAULT_LANGUAGE:-de}
        NUXT_PUBLIC_DEFAULT_PROFILE: ${NUXT_PUBLIC_DEFAULT_PROFILE:-default}
        NUXT_PUBLIC_CALENDAR_ENABLED: ${NUXT_PUBLIC_CALENDAR_ENABLED:-false}
        NUXT_PUBLIC_DATA_MODE: ${NUXT_PUBLIC_DATA_MODE:-directus}
    expose:
      - "3000"
    networks: [default, coolify]
    labels:
      - caddy_0=${PWA_ORIGIN}
      - caddy_0.encode=zstd gzip
      - caddy_0.reverse_proxy={{upstreams 3000}}
      - caddy_0.header=-Server
      - caddy_ingress_network=coolify
    environment:
      # Public config again at runtime: Nitro renders runtimeConfig.public from these
      # into the page, so the URLs are right even if Coolify's build step did not
      # interpolate the build args above.
      NUXT_PUBLIC_DIRECTUS_URL: ${NUXT_PUBLIC_DIRECTUS_URL}
      NUXT_PUBLIC_SSO_PROVIDER: keycloak
      NUXT_DIRECTUS_INTERNAL_URL: http://directus:8055
      NUXT_PUBLIC_RESONA_API_URL: ${NUXT_PUBLIC_RESONA_API_URL}
      NUXT_PUBLIC_DEFAULT_LANGUAGE: ${NUXT_PUBLIC_DEFAULT_LANGUAGE:-de}
      NUXT_PUBLIC_DEFAULT_PROFILE: ${NUXT_PUBLIC_DEFAULT_PROFILE:-default}
      NUXT_PUBLIC_DATA_MODE: ${NUXT_PUBLIC_DATA_MODE:-directus}
      # Server-only secrets — never baked into the bundle, read at runtime by Nitro.
      NUXT_GOOGLE_CLIENT_ID: ${NUXT_GOOGLE_CLIENT_ID:-}
      NUXT_GOOGLE_CLIENT_SECRET: ${NUXT_GOOGLE_CLIENT_SECRET:-}
      NUXT_GOOGLE_REDIRECT_URI: ${NUXT_GOOGLE_REDIRECT_URI:-}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-}
    depends_on:
      directus-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  project-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN}
      # The Resona hub runs externally — point this at its reachable URL.
      RESONA_API_URL: ${RESONA_API_URL:?set RESONA_API_URL}
      # Hub client token (org-bound); required.
      RESONA_API_KEY: ${RESONA_API_KEY:?set RESONA_API_KEY}
      # Audio engine requested per job; empty = hub default.
      WORKER_ENGINE: ${WORKER_ENGINE:-}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5}
      WORKER_BATCH: ${WORKER_BATCH:-5}
      WORKER_STALE_MINUTES: ${WORKER_STALE_MINUTES:-15}
      LOGLEVEL: ${LOGLEVEL:-info}
    extra_hosts:
      # lets the container reach a resona-api running on the docker host (Linux)
      - "host.docker.internal:host-gateway"
    depends_on:
      directus:
        condition: service_healthy
      directus-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  # Opt-in encrypted off-site backup (COMPOSE_PROFILES=backup): consistent SQLite
  # dump of Directus + uploads → restic repository on S3-compatible storage, daily
  # with retention. The hub's resona-data volume can be added; runbook and restore
  # drill: docs/server/pwa-backups.md. Credentials are checked by the script, so
  # deployments without the profile need none of them.
  backup:
    profiles: [backup]
    build:
      context: ./backup
      dockerfile: Dockerfile
    volumes:
      # rw only so SQLite can take its shared lock; the dump connection is read-only.
      - directus-db:/source/directus/database
      - directus-uploads:/source/directus/uploads:ro
      - backup-cache:/root/.cache/restic
      # last-success / first-due survive restarts, so the healthcheck keeps its history.
      - backup-state:/state
      # Optional: the hub's resona-data volume (same Docker host). Set HUB_DATA_VOLUME
      # to its real Docker name; unset mounts an empty placeholder that is ignored.
      - hub-data:/source/hub
    tmpfs:
      - /dumps
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_HUB: ${HUB_DATA_VOLUME:+true}
      TZ: ${BACKUP_TZ:-Europe/Berlin}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_ON_START: ${BACKUP_ON_START:-true}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_HOST_TAG: ${BACKUP_HOST_TAG:-resona-pwa}
    healthcheck:
      # unhealthy once the last successful backup is older than 26 h; until the first
      # backup of a start is due (+2 h grace) a missing or old one counts as healthy
      test: ["CMD", "/usr/local/bin/resona-backup", "healthy"]
      interval: 15m
      timeout: 10s
      retries: 1
      start_period: 2h
    depends_on:
      directus:
        condition: service_healthy
    restart: unless-stopped

volumes:
  directus-db:
  directus-uploads:
  backup-cache:
  backup-state:
  hub-data:
    name: ${HUB_DATA_VOLUME:-resona-pwa-backup-no-hub}

networks:
  coolify:
    external: true
