[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resona-mcp"
version = "0.2.5"
description = "MCP server for the Resona hub: async audio/document jobs over stdio or Streamable HTTP."
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "python-decouple>=3.8",
    "resona-client>=0.1.0",
    "starlette>=0.46",
    "uvicorn>=0.31.1",
]

[project.scripts]
resona-mcp = "resona_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/resona_mcp"]

[tool.uv.sources]
resona-client = { workspace = true }
