name: Test

on:
  push:
    branches: [main]
    # PWA-only changes run in pwa.yml.
    paths-ignore: ['apps/resona-pwa/**']
  pull_request:
    paths-ignore: ['apps/resona-pwa/**']

jobs:
  pytest:
    # Pinned: on ubuntu-26.04 libportaudio2 uses the PulseAudio backend and fails
    # to initialize without an audio server, so importing `sounddevice` errors.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        # libportaudio2  → required by `sounddevice` (imported by test_micrec)
        # ffmpeg         → required by `resona_asr_core.audio.load_audio()`
        # tesseract-ocr  → tesseract OCR tests; English pack only (tests expect `deu` missing)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 ffmpeg tesseract-ocr

      # setup-uv dropped moving major tags in v8 — pin a specific version.
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install workspace packages
        run: uv sync --all-packages

      # Like `resona-worker prepare`: fetch the pinned Docling weights, so the worker's
      # private (offline) execution smoke test finds them in the HF cache.
      - name: Prepare Docling weights
        run: |
          uv run python -c "
          from huggingface_hub import snapshot_download
          from resona_engine_docling import stage_weights
          for repo, rev in stage_weights():
              snapshot_download(repo, revision=rev)
          "

      - name: Run tests
        run: uv run pytest
