name: Release

# Fires on:
#   - pushing a tag like vX.Y.Z (the normal release path)
#   - manual run from the Actions UI (workflow_dispatch) for re-runs / dry-runs
#     (dry-run: images are built but not pushed, no GitHub release, no dispatch)
#
# A Resona release is an immutable pin set (see docs/server/releases.md):
#   verify   - tag == resona-api/resona-worker version, privacy/lease/release tests,
#              tool-inventory.json matches the MCP tool surface
#   wheels   - `uv build` of every workspace package
#   images   - hub CPU image, worker CPU image, worker CUDA image, legacy engine images;
#              each pushed by tag and recorded by DIGEST
#   eval-cpu - `resona eval --profile cpu-private` (local mode) on eval/corpus against
#              eval/baselines.json; a gate failure or missing baseline fails the release
#   manifest - release-manifest.json (wheels by sha256, images by digest, models by
#              revision), validated against release/manifest.schema.json; draft GitHub
#              release with wheels + manifest + tool-inventory.json as assets
#   notify-downstream - optional SKAILE `mcp-release` dispatch (see the job)
#
# Repository variables (Settings > Variables), all optional:
#   RESONA_IMAGE_NAMESPACE        registry/namespace for images (default ghcr.io/ecsplico)
#   RESONA_PUBLISH_PYPI           'true' to also publish wheels to PyPI (OIDC trusted publishing)
#   RESONA_DISPATCH_MCP_RELEASE   'true' to dispatch mcp-release to skaile-ai/ai-assets;
#                                 needs repo secrets RELEASE_DISPATCH_APP_ID / RELEASE_DISPATCH_APP_KEY

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAMESPACE: ${{ vars.RESONA_IMAGE_NAMESPACE || 'ghcr.io/ecsplico' }}
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify:
    name: Verify versions, privacy/lease tests, tool inventory
    # Pinned like test.yml: libportaudio2 on ubuntu-26.04 needs a PulseAudio server.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 ffmpeg

      # setup-uv dropped moving major tags in v8 — pin a specific version.
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install workspace packages
        run: uv sync --all-packages --frozen

      # Workers report their resona-worker version as their release and the hub its
      # resona-api version, so both must equal the tag (v0.2.0 -> 0.2.0).
      - name: Resolve and check the release id
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          api=$(uv run python -c "import importlib.metadata as m; print(m.version('resona-api'))")
          worker=$(uv run python -c "import importlib.metadata as m; print(m.version('resona-worker'))")
          if [ "$IS_TAG" = "true" ]; then version="${REF_NAME#v}"; else version="$api"; fi
          if [ "$api" != "$version" ] || [ "$worker" != "$version" ]; then
            echo "::error::release $version needs resona-api ($api) and resona-worker ($worker) at the same version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Privacy, lease, release and update tests
        run: >-
          uv run pytest -q
          packages/api/tests packages/job-core packages/postprocess/tests
          apps/resona-worker/tests apps/resona-mcp/tests packages/client/tests
          -k 'not smoke'

      - name: tool-inventory.json matches the MCP tool surface
        run: uv run python scripts/gen_tool_inventory.py --check

  wheels:
    name: Build wheels
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Build every workspace package
        run: uv build --all-packages --wheel --out-dir dist/
      - uses: actions/upload-artifact@v5
        with:
          name: wheels
          path: dist/*.whl
          if-no-files-found: error

  images:
    name: Image ${{ matrix.image.name }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: resona-hub,                   dockerfile: packages/api/Dockerfile,           build_args: "" }
          - { name: resona-worker,                dockerfile: apps/resona-worker/Dockerfile,     build_args: "" }
          - name: resona-worker-cuda
            dockerfile: apps/resona-worker/Dockerfile
            build_args: |
              BASE_IMAGE=nvidia/cuda:13.0.1-runtime-ubuntu24.04
              WORKER_EXTRAS=--extra cuda --extra documents
          - { name: resona-engine-faster-whisper, dockerfile: packages/engine-faster-whisper/Dockerfile, build_args: "" }
          - { name: resona-engine-whisper,        dockerfile: packages/engine-whisper/Dockerfile,        build_args: "" }
          - { name: resona-engine-voxtral,        dockerfile: packages/engine-voxtral/Dockerfile,        build_args: "" }
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true' && startsWith(env.IMAGE_NAMESPACE, 'ghcr.io/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ env.PUBLISH == 'true' && ' & push' || '' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          # Version tag only; consumers pin the digest from release-manifest.json.
          tags: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image.name }}:${{ needs.verify.outputs.version }}
          build-args: |
            RESONA_RELEASE_ID=${{ needs.verify.outputs.version }}
            ${{ matrix.image.build_args }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Record the digest
        if: env.PUBLISH == 'true'
        env:
          NAME: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          case "$DIGEST" in sha256:*) ;; *) echo "::error::no digest for $NAME"; exit 1 ;; esac
          mkdir -p digests
          printf '%s=%s\n' "$NAME" "$DIGEST" > "digests/${{ matrix.image.name }}.txt"

      - uses: actions/upload-artifact@v5
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.image.name }}
          path: digests/
          if-no-files-found: error

  eval-cpu:
    name: CPU corpus evaluation (cpu-private)
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 ffmpeg
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install workspace packages
        run: uv sync --all-packages --frozen

      # Weights are fetched here, at the revisions the release pins, never by a job.
      - name: Prepare pinned models
        run: |
          set -euo pipefail
          rev=$(jq -r '.[] | select(.model == "Systran/faster-whisper-large-v3") | .revision' apps/resona-worker/src/resona_worker/models.json)
          uv run hf download Systran/faster-whisper-large-v3 --revision "$rev" > /dev/null
          uv run docling-tools models download > /dev/null

      - name: Evaluate against eval/baselines.json
        run: uv run resona eval --profile cpu-private --platform cpu --output-dir eval-report

      # Metrics and provenance only; the corpus is synthetic.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: eval-cpu-report
          path: eval-report/
          if-no-files-found: warn

  # PyPI is opt-in (RESONA_PUBLISH_PYPI) because the namespace is unverified; the GitHub
  # release assets are the canonical wheel distribution. PREREQUISITE, once per package:
  # register it at https://pypi.org/manage/account/publishing/ as a pending publisher for
  # owner=ecsplico, repository=resona, workflow name=Release, environment blank; otherwise
  # the publish step fails with "invalid-publisher".
  pypi:
    name: Publish wheels to PyPI
    needs: [wheels, eval-cpu]
    if: startsWith(github.ref, 'refs/tags/v') && vars.RESONA_PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI trusted-publishing OIDC; each name needs a pending publisher first
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: wheels
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  manifest:
    name: Release manifest and draft GitHub release
    needs: [verify, wheels, images, eval-cpu]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # softprops/action-gh-release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so release notes can diff against the prior tag
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Set up Python 3.12
        run: uv python install 3.12
      - uses: actions/download-artifact@v5
        with:
          name: wheels
          path: dist/
      - uses: actions/download-artifact@v5
        with:
          pattern: digest-*
          path: digests/
          merge-multiple: true

      - name: Build release-manifest.json
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          args=()
          for file in digests/*.txt; do args+=(--image "$(cat "$file")"); done
          # Third-party versions resona-worker was tested with; `resona-worker update` installs under them.
          uv export --frozen --package resona-worker --all-extras --no-emit-workspace \
            --no-hashes --no-header --no-annotate --output-file dist/worker-constraints.txt
          uv run --frozen --no-dev --package resona-job-core python release/build_manifest.py \
            --release-id "$VERSION" --dist dist/ "${args[@]}" \
            --models apps/resona-worker/src/resona_worker/models.json --constraints dist/worker-constraints.txt \
            --out dist/release-manifest.json
          cp tool-inventory.json release/manifest.schema.json dist/

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.whl
            dist/release-manifest.json
            dist/worker-constraints.txt
            dist/tool-inventory.json
            dist/manifest.schema.json

  # SKAILE catalog update, same payload shape as skaile-ai/excel-mcp's notify-downstream:
  # {event_type:"mcp-release", client_payload:{mcp, version, tools}} with tools = the
  # checked-in tool-inventory.json ([{name, deferred}], sorted). ai-assets'
  # mcp-release-bump.yml maps mcp "resona-hub" to mcp/resona-hub/MCP.md, bumps its
  # `# mcp-catalog-version` line and diffs the <!-- mcp-catalog-tools --> block against
  # `tools`. skaile-ai/platform is NOT a target: its mcp-release-issue.yml only handles
  # flake-pinned stdio servers (excel/ppt/word) and fails on any other name; a hosted
  # HTTP server has nothing to adopt there.
  #
  # Credentials: the skaile-release-dispatch GitHub App (owned by skaile-ai). Its id/key
  # are skaile-ai ORGANIZATION secrets, which a repo in the ecsplico org never receives,
  # so this repo needs its own secrets RELEASE_DISPATCH_APP_ID / RELEASE_DISPATCH_APP_KEY
  # (same App; the token is minted for owner skaile-ai) plus the variable
  # RESONA_DISPATCH_MCP_RELEASE=true. Off until both exist.
  notify-downstream:
    name: Dispatch mcp-release
    needs: [verify, manifest]
    if: startsWith(github.ref, 'refs/tags/v') && vars.RESONA_DISPATCH_MCP_RELEASE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}   # the tagged commit, never a moving main
          fetch-depth: 1

      - name: Mint installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.RELEASE_DISPATCH_APP_KEY }}
          owner: skaile-ai
          repositories: ai-assets

      - name: Dispatch mcp-release to ai-assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          jq -e 'type == "array" and length > 0' tool-inventory.json > /dev/null
          jq -nc --arg v "$VERSION" --argjson t "$(cat tool-inventory.json)" \
            '{event_type:"mcp-release",client_payload:{mcp:"resona-hub",version:$v,tools:$t}}' \
            | gh api repos/skaile-ai/ai-assets/dispatches --input -
          echo "dispatched mcp-release resona-hub@$VERSION -> skaile-ai/ai-assets"
