name: Verlauf

# apps/resona-verlauf is a Nuxt layer app extending apps/resona-pwa, so it
# rebuilds whenever either changes.

on:
  push:
    branches: [main]
    paths:
      - 'apps/resona-verlauf/**'
      - 'apps/resona-pwa/**'
      - '.github/workflows/verlauf.yml'
  pull_request:
    paths:
      - 'apps/resona-verlauf/**'
      - 'apps/resona-pwa/**'
      - '.github/workflows/verlauf.yml'

defaults:
  run:
    working-directory: apps/resona-verlauf

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install layer dependencies
        working-directory: apps/resona-pwa
        run: bun install --frozen-lockfile

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
