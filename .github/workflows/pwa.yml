name: PWA

# apps/resona-pwa has its own toolchain (bun + Nuxt, and a uv-managed worker),
# so it gets its own workflow, scoped to its directory.

on:
  push:
    branches: [main]
    paths:
      - 'apps/resona-pwa/**'
      - '.github/workflows/pwa.yml'
  pull_request:
    paths:
      - 'apps/resona-pwa/**'
      - '.github/workflows/pwa.yml'

defaults:
  run:
    working-directory: apps/resona-pwa

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  worker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/resona-pwa/worker
    steps:
      - uses: actions/checkout@v5

      # setup-uv dropped moving major tags in v8 — pin a specific version.
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/resona-pwa/worker/uv.lock

      - name: Test
        run: uv run --python 3.12 pytest -q

  # The user policy + owner-guard extension against a real Directus (#19): the
  # image from directus/Dockerfile.directus (pinned minor), bootstrap.mjs twice
  # (idempotent), then directus/verify-permissions.mjs.
  directus:
    runs-on: ubuntu-24.04
    env:
      DIRECTUS_URL: http://localhost:8055
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-password
      DIRECTUS_TOKEN: ci-worker-token
    steps:
      - uses: actions/checkout@v5

      - name: Start Directus
        run: |
          docker build -t resona-directus -f directus/Dockerfile.directus directus
          docker run -d --name directus -p 8055:8055 \
            -e SECRET=ci-secret-not-used-anywhere-else \
            -e ADMIN_EMAIL -e ADMIN_PASSWORD \
            -e DB_CLIENT=sqlite3 -e DB_FILENAME=/directus/database/data.db \
            resona-directus
          for i in $(seq 90); do curl -sf "$DIRECTUS_URL/server/health" >/dev/null && exit 0; sleep 2; done
          docker logs directus; exit 1

      - name: Bootstrap
        run: node directus/bootstrap.mjs && node directus/bootstrap.mjs

      - name: Verify permissions
        run: node directus/verify-permissions.mjs

      - name: Directus logs
        if: failure()
        run: docker logs directus
