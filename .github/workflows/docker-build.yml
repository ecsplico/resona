name: Docker build (PR check)

# Builds every image without pushing — catches Dockerfile / dependency
# breakage on PRs before a tag actually triggers a real GHCR push.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**/Dockerfile'
      - 'packages/**/pyproject.toml'
      - 'apps/resona-worker/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - 'packages/**/Dockerfile'
      - 'packages/**/pyproject.toml'
      - 'apps/resona-worker/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docker-build.yml'

jobs:
  build:
    name: Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: resona-engine-faster-whisper, dockerfile: packages/engine-faster-whisper/Dockerfile, build_args: "" }
          - { name: resona-engine-whisper,        dockerfile: packages/engine-whisper/Dockerfile,        build_args: "" }
          - { name: resona-engine-voxtral,        dockerfile: packages/engine-voxtral/Dockerfile,        build_args: "" }
          - { name: resona-hub,                   dockerfile: packages/api/Dockerfile,                   build_args: "" }
          - { name: resona-worker,                dockerfile: apps/resona-worker/Dockerfile,             build_args: "" }
          - name: resona-worker-cuda
            dockerfile: apps/resona-worker/Dockerfile
            build_args: |
              BASE_IMAGE=nvidia/cuda:13.0.1-runtime-ubuntu24.04
              WORKER_EXTRAS=--extra cuda --extra documents --extra diarize
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          push: false
          build-args: ${{ matrix.image.build_args }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
