services:
  engine-faster-whisper:
    profiles: ["faster-whisper"]
    build:
      context: .
      dockerfile: packages/engine-faster-whisper/Dockerfile
    ports:
      - "7720:7001"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    environment:
      RESONA_ENGINE: faster-whisper
      DEFAULT_FASTWHISPER_MODEL: large-v3
      LOGLEVEL: info
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3.12", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  engine-whisper:
    profiles: ["whisper"]
    build:
      context: .
      dockerfile: packages/engine-whisper/Dockerfile
    ports:
      - "7722:7001"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    environment:
      RESONA_ENGINE: whisper
      DEFAULT_WHISPER_MODEL: large-v3
      LOGLEVEL: info
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3.12", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  engine-voxtral:
    profiles: ["voxtral"]
    build:
      context: .
      dockerfile: packages/engine-voxtral/Dockerfile
    ports:
      - "7723:7001"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    environment:
      RESONA_ENGINE: voxtral
      DEFAULT_VOXTRAL_MODEL: openai/whisper-large-v3
      LOGLEVEL: info
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3.12", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  engine-parakeet:
    profiles: ["parakeet"]
    build:
      context: .
      dockerfile: packages/engine-parakeet/Dockerfile
    ports:
      - "7721:7001"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    environment:
      RESONA_ENGINE: parakeet
      DEFAULT_PARAKEET_MODEL: nvidia/parakeet-tdt-0.6b-v3
      LOGLEVEL: info
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3.12", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "7710:7000"
    volumes:
      # One volume at /data: the image creates /data owned by its non-root
      # `resona` user (UID 1000), so a fresh named volume inherits that owner.
      # Mounting under /app/data would create root-owned, unwritable dirs.
      - resona-data:/data
    environment:
      RESONA_ENGINE_URLS: http://engine-faster-whisper:7001,http://engine-whisper:7001,http://engine-voxtral:7001,http://engine-parakeet:7001
      DATA_PATH: /data
      LOGLEVEL: info
    env_file:
      - .env
    depends_on:
      engine-faster-whisper:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python3.12", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  resona-data:
