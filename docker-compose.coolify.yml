# Coolify deployment of the Resona hub (Docker Compose build pack, "Raw Compose
# Deployment" ON). Runbook: docs/server/coolify.md.
#
# Hub only: job API + SQLite + pull-worker broker (`hub`) and the hosted MCP server
# (`mcp`, same image) behind Coolify's Caddy proxy. No models, GPUs, Docker socket,
# privileges or published ports; SQLite lives on the `resona-data` volume and is
# never exposed. Inference runs on approved pull workers that connect outbound over
# HTTPS. In raw mode Coolify adds no networks/labels, so the proxy wiring (Caddy
# labels, `coolify` network) is declared here.
#
# Image: built by Coolify from packages/api/Dockerfile at the deployed commit, so
# the running image is pinned by that commit. Coolify builds in the cloned repo but
# starts the stack from its own directory without the sources, so `hub` must not
# set `pull_policy: build` (start would rebuild from a missing context); `mcp`
# reuses the freshly built local tag. Once release images are published, replace
# `build:` with `image: ghcr.io/ecsplico/resona-api@sha256:<digest>` from the
# release manifest and drop `pull_policy` from `mcp`.
#
# No variable is required: defaults serve https://resona.ecsplico.de.
#   RESONA_PUBLIC_URL        public origin (Caddy site, CORS, MCP Origin allowlist)
#   RESONA_PUBLIC_HOST       its host name (MCP Host allowlist)
#   RESONA_MAX_UPLOAD_BYTES  upload / worker-result cap, enforced by the app
#   LOGLEVEL                 uvicorn log level (access lines carry no query strings)
# An optional CPU fallback worker is deliberately absent; see docs/server/coolify.md.

x-hardening: &hardening
  read_only: true
  tmpfs: ['/tmp']
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

services:
  hub:
    <<: *hardening
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: resona-hub:coolify
    restart: unless-stopped
    stop_grace_period: 30s
    expose: ['7000']
    networks: [default, coolify]
    volumes:
      - resona-data:/data
    environment:
      DATA_PATH: /data
      RESONA_MAX_UPLOAD_BYTES: ${RESONA_MAX_UPLOAD_BYTES:-209715200}
      CORS_ORIGINS: ${RESONA_PUBLIC_URL:-https://resona.ecsplico.de}
      LOGLEVEL: ${LOGLEVEL:-info}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - caddy_0=${RESONA_PUBLIC_URL:-https://resona.ecsplico.de}
      - caddy_0.reverse_proxy={{upstreams 7000}}
      - caddy_0.header=-Server
      - caddy_ingress_network=coolify

  mcp:
    <<: *hardening
    image: resona-hub:coolify
    pull_policy: never
    command: ['resona-mcp', 'http', '--host', '0.0.0.0', '--port', '7010']
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    expose: ['7010']
    networks: [default, coolify]
    environment:
      RESONA_API_URL: http://hub:7000
      RESONA_MCP_ALLOWED_HOSTS: ${RESONA_PUBLIC_HOST:-resona.ecsplico.de},${RESONA_PUBLIC_HOST:-resona.ecsplico.de}:*
      RESONA_MCP_ALLOWED_ORIGINS: ${RESONA_PUBLIC_URL:-https://resona.ecsplico.de}
    labels:
      # Same Caddy site as the hub; the path-matched route sorts before the hub's catch-all.
      - caddy_0=${RESONA_PUBLIC_URL:-https://resona.ecsplico.de}
      - caddy_0.reverse_proxy=/mcp* {{upstreams 7010}}
      - caddy_0.reverse_proxy.flush_interval=-1
      - caddy_ingress_network=coolify

volumes:
  resona-data:

networks:
  coolify:
    external: true
