# Coolify deployment of the Resona hub (Docker Compose build pack, "Raw Compose
# Deployment" ON). Runbook: docs/server/coolify.md.
#
# Hub: job API + SQLite + pull-worker broker (`hub`) and the hosted MCP server
# (`mcp`, same image) behind Coolify's Caddy proxy, plus one internal live
# recognizer (`engine-faster-whisper`, CPU) for `WS /v1/listen` live dictation.
# No GPUs, Docker socket, privileges or published ports; SQLite lives on the
# `resona-data` volume and is never exposed. Queued jobs run on approved pull
# workers that connect outbound over HTTPS. In raw mode Coolify adds no
# networks/labels, so the proxy wiring (Caddy labels, `coolify` network) is
# declared here. The engine has no labels and is not on the `coolify` network:
# only the hub reaches it, over the compose-internal `default` network.
#
# Images: released images from GHCR, pinned by digest (never a mutable tag).
# The release workflow pushes ghcr.io/ecsplico/resona-hub and
# ghcr.io/ecsplico/resona-engine-faster-whisper; bump the `image:` lines to the
# digests from that release's release-manifest.json (docs/server/coolify.md).
# Current hub: sha256:50ab25d2… = ghcr.io/ecsplico/resona-hub:0.2.0 (linux/amd64, release v0.2.0, commit 6abf985).
# Current engine: sha256:7d06bf40… = ghcr.io/ecsplico/resona-engine-faster-whisper:0.2.0 (linux/amd64, release v0.2.0).
# The packages are private: the host pulls with a read:packages-only token (docs/server/coolify.md).
#
# No variable is required: defaults serve https://resona-hub.ecsplico.de.
#   RESONA_PUBLIC_URL        public origin (Caddy site, CORS, MCP Origin allowlist)
#   RESONA_PUBLIC_HOST       its host name (MCP Host allowlist)
#   RESONA_MAX_UPLOAD_BYTES  upload / worker-result cap, enforced by the app
#   RESONA_ENGINE_URLS       live engine-server(s) the hub probes, comma-separated,
#                            first reachable wins (default: the internal engine)
#   DEFAULT_FASTWHISPER_MODEL, FASTWHISPER_*  internal engine model and CPU knobs
#   ENGINE_CPUS, ENGINE_MEM_LIMIT             internal engine resource limits
#   LOGLEVEL                 uvicorn log level (access lines carry no query strings)
# An optional CPU fallback *worker* (queued jobs) is deliberately absent; see docs/server/coolify.md.

x-hardening: &hardening
  read_only: true
  tmpfs: ['/tmp']
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

services:
  hub:
    <<: *hardening
    image: ghcr.io/ecsplico/resona-hub@sha256:50ab25d27af6c799e509b62e5f4f79ee13fe80845aef89a563d7837a577762f4
    restart: unless-stopped
    stop_grace_period: 30s
    expose: ['7000']
    networks: [default, coolify]
    volumes:
      - resona-data:/data
    environment:
      DATA_PATH: /data
      RESONA_MAX_UPLOAD_BYTES: ${RESONA_MAX_UPLOAD_BYTES:-209715200}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://resona.ecsplico.de,${RESONA_PUBLIC_URL:-https://resona-hub.ecsplico.de}}
      RESONA_PUBLIC_URL: ${RESONA_PUBLIC_URL:-https://resona-hub.ecsplico.de}
      # Live recognizer(s) behind WS /v1/listen. Point at a GPU engine-server with
      # e.g. "https://<gpu-host>,http://engine-faster-whisper:7001" (first
      # reachable wins; the internal CPU engine stays the fallback).
      RESONA_ENGINE_URLS: ${RESONA_ENGINE_URLS:-http://engine-faster-whisper:7001}
      LOGLEVEL: ${LOGLEVEL:-info}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - caddy_0=${RESONA_PUBLIC_URL:-https://resona-hub.ecsplico.de}
      - caddy_0.reverse_proxy={{upstreams 7000}}
      - caddy_0.header=-Server
      # Temporary: workers enrolled against the old hub origin (the PWA now owns
      # resona.ecsplico.de) keep their pull protocol until they are re-pointed.
      - caddy_1=https://resona.ecsplico.de
      - caddy_1.handle=/v1/workers/*
      - caddy_1.handle.reverse_proxy={{upstreams 7000}}
      - caddy_ingress_network=coolify

  mcp:
    <<: *hardening
    image: ghcr.io/ecsplico/resona-hub@sha256:50ab25d27af6c799e509b62e5f4f79ee13fe80845aef89a563d7837a577762f4
    command: ['resona-mcp', 'http', '--host', '0.0.0.0', '--port', '7010']
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    expose: ['7010']
    networks: [default, coolify]
    environment:
      RESONA_API_URL: http://hub:7000
      RESONA_MCP_ALLOWED_HOSTS: ${RESONA_PUBLIC_HOST:-resona-hub.ecsplico.de},${RESONA_PUBLIC_HOST:-resona-hub.ecsplico.de}:*
      RESONA_MCP_ALLOWED_ORIGINS: ${RESONA_PUBLIC_URL:-https://resona-hub.ecsplico.de}
    labels:
      # Same Caddy site as the hub; the path-matched route sorts before the hub's catch-all.
      - caddy_0=${RESONA_PUBLIC_URL:-https://resona-hub.ecsplico.de}
      - caddy_0.reverse_proxy=/mcp* {{upstreams 7010}}
      - caddy_0.reverse_proxy.flush_interval=-1
      - caddy_ingress_network=coolify

  # Internal live recognizer for WS /v1/listen. No labels, no `coolify` network,
  # no published port: reachable only from the hub. Runs as the image's root
  # user on a read-only root filesystem; the only writable paths are the model
  # cache volume and /tmp. The first start downloads the model into `hf-cache`.
  engine-faster-whisper:
    <<: *hardening
    image: ghcr.io/ecsplico/resona-engine-faster-whisper@sha256:7d06bf405254a2dc2cfe6d257a560b2221a2d8b6e0e03bbce313ad2127f5ee33
    restart: unless-stopped
    expose: ['7001']
    networks: [default]
    volumes:
      - hf-cache:/root/.cache/huggingface
    # The Coolify host (6 cores, 16 GB) is shared with other apps: cap the engine.
    cpus: ${ENGINE_CPUS:-3}
    mem_limit: ${ENGINE_MEM_LIMIT:-3g}
    environment:
      RESONA_ENGINE: faster-whisper
      DEFAULT_FASTWHISPER_MODEL: ${DEFAULT_FASTWHISPER_MODEL:-small}
      # int8 + greedy decoding keep `small` near real time on 3 cores.
      FASTWHISPER_COMPUTE_TYPE: ${FASTWHISPER_COMPUTE_TYPE:-int8}
      FASTWHISPER_BEAM_SIZE: ${FASTWHISPER_BEAM_SIZE:-1}
      # Match ENGINE_CPUS; 0 (auto) would size the pool for all host cores.
      FASTWHISPER_CPU_THREADS: ${FASTWHISPER_CPU_THREADS:-3}
      FASTWHISPER_BATCHED: ${FASTWHISPER_BATCHED:-true}
      FASTWHISPER_BATCH_SIZE: ${FASTWHISPER_BATCH_SIZE:-4}
      PYTHONDONTWRITEBYTECODE: '1'
      LOGLEVEL: ${LOGLEVEL:-info}
    healthcheck:
      test: ['CMD', 'python3.12', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      # the first start downloads the model weights
      start_period: 600s

volumes:
  resona-data:
  hf-cache:

networks:
  coolify:
    external: true
