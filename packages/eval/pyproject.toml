[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resona-eval"
version = "0.2.5"
description = "Resona quality control: evaluation corpus, WER/CER and document scoring, regression gate and baselines. No ML dependencies."
license = { text = "Apache-2.0" }
authors = [
    { name = "mortegro", email = "495066+mortegro@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "jiwer>=3.1",
    "resona-job-core>=0.1.0",
]

[tool.uv.sources]
resona-job-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/resona_eval"]
