[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resona-diarize"
version = "0.2.1"
description = "Speaker diarization for Resona workers: Nemotron-3-Diarization turns and word-level speaker assignment"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "librosa>=0.10.1",
    "numpy>=2.1.3",
    "torch>=2.6.0",
    # Nemotron-3-Diarization (nemotron3_diarization) ships in transformers 5.22.2.
    "transformers>=5.22.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resona_diarize"]
