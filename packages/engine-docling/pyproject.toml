[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resona-engine-docling"
version = "0.2.1"
description = "Document conversion (PDF/image to Markdown with OCR) for Resona, backed by in-process Docling. Not an audio engine: not registered in resona.engines."
license = { text = "Apache-2.0" }
authors = [
    { name = "mortegro", email = "495066+mortegro@users.noreply.github.com" },
]
requires-python = ">=3.12"
keywords = ["ocr", "docling", "pdf", "markdown", "document", "resona"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "resona-job-core>=0.1.0",
    # Pinned: the adapter binds to Docling option classes and export APIs of this exact release.
    # `ocrmac` resolves to the Apple Vision backend only on darwin; `rapidocr` is the cross-platform ONNX OCR.
    "docling[ocrmac,rapidocr]==2.129.0",
    # docling 2.129 resolves PP-OCR recognizers via PP_OCRV6_LANGS, which rapidocr 3.10 no longer exposes.
    "rapidocr==3.9.2",
    # orientation.py renders pages and turns rasters itself (both already Docling dependencies).
    "pypdfium2>=5",
    "pillow>=11",
]

[project.urls]
Homepage = "https://github.com/ecsplico/resona"
Documentation = "https://ecsplico.github.io/resona/"
Repository = "https://github.com/ecsplico/resona"
Issues = "https://github.com/ecsplico/resona/issues"

[tool.uv.sources]
resona-job-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/resona_engine_docling"]
