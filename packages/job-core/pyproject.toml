[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resona-job-core"
version = "0.2.4"
description = "Resona job/result contracts and execution-policy enforcement. No ML dependencies."
license = { text = "Apache-2.0" }
authors = [
    { name = "mortegro", email = "495066+mortegro@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resona_job_core"]
