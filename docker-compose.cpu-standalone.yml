# Self-contained CPU-only stack for a single CPU-only host (e.g. Dokploy).
#
# Why a separate file rather than `-f docker-compose.resona.yml -f
# docker-compose.cpu.yml`: Dokploy deploys a compose service from ONE compose
# path, so the CPU override cannot be layered at deploy time. This file is the
# merged, GPU-free result — api + faster-whisper engine only.
#
# Differences from docker-compose.resona.yml:
#   - no `profiles`, so the engine always starts
#   - no GPU device reservation (CTranslate2 falls back to CPU, compute int8)
#   - a smaller default model, since a CPU host cannot serve large-v3 usefully
#   - the HuggingFace cache is a named volume, not a ${HOME} bind mount
#   - no `env_file`, so a missing .env cannot fail the deploy; every knob below
#     is overridable from the deployment platform's environment instead
services:
  engine-faster-whisper:
    build:
      context: .
      dockerfile: packages/engine-faster-whisper/Dockerfile
    ports:
      - "${ENGINE_PORT:-7720}:7001"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      RESONA_ENGINE: faster-whisper
      DEFAULT_FASTWHISPER_MODEL: ${DEFAULT_FASTWHISPER_MODEL:-small}
      # int8 on CPU; greedy decoding and VAD-chunked batching keep an 8-core
      # box near real time. Raise the model or beam size only with headroom.
      FASTWHISPER_COMPUTE_TYPE: ${FASTWHISPER_COMPUTE_TYPE:-int8}
      FASTWHISPER_BEAM_SIZE: ${FASTWHISPER_BEAM_SIZE:-1}
      FASTWHISPER_CPU_THREADS: ${FASTWHISPER_CPU_THREADS:-0}
      FASTWHISPER_BATCHED: ${FASTWHISPER_BATCHED:-true}
      FASTWHISPER_BATCH_SIZE: ${FASTWHISPER_BATCH_SIZE:-8}
      LOGLEVEL: ${LOGLEVEL:-info}
    healthcheck:
      test: ["CMD", "python3.12", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      # first start downloads the model weights
      start_period: 600s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "${API_PORT:-7710}:7000"
    volumes:
      # /data is owned by the image's non-root user; see docker-compose.resona.yml.
      - resona-data:/data
    environment:
      RESONA_ENGINE_URLS: http://engine-faster-whisper:7001
      DATA_PATH: /data
      # Browser origin of the PWA — it calls this API directly (live WebSocket
      # /v1/listen and REST), so CORS must name it.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOGLEVEL: ${LOGLEVEL:-info}
    depends_on:
      engine-faster-whisper:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python3.12", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Outbound-only pull worker for queued jobs (execution profile `cpu-private`).
  # Off until prepared and approved; enable with COMPOSE_PROFILES=worker.
  # Host networking because the worker accepts plain http only for loopback:
  # it reaches the api on the host-published port. One-off setup, from this
  # file's directory (docs/server/cpu-standalone.md):
  #   docker compose -f docker-compose.cpu-standalone.yml --profile worker \
  #     run --rm worker prepare --profile cpu-private --out /state/capabilities.json
  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: apps/resona-worker/Dockerfile
    command:
      - run
      - --hub
      - http://127.0.0.1:${API_PORT:-7710}
      - --token-file
      - /run/secrets/resona-worker-token
      - --capabilities-file
      - /state/capabilities.json
      - --work-dir
      - /work
    network_mode: host
    volumes:
      - worker-models:/models
      - worker-state:/state
      # mode 0600, owned by UID 1000 (the image's `resona` user)
      - type: bind
        source: ${RESONA_WORKER_TOKEN_FILE:-/etc/resona/worker.token}
        target: /run/secrets/resona-worker-token
        read_only: true
    tmpfs:
      - /work:size=4g,mode=0700,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  resona-data:
  hf-cache:
  worker-models:
  worker-state:
